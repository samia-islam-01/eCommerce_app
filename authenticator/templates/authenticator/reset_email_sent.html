{% extends 'base.html' %}
{% block title %}Reset Email Sent{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="alert alert-success">
            <h4 class="alert-heading">Reset Email Sent</h4>
            <p>If an account with email <strong>{{ email }}</strong> exists, a password reset link has been sent. Please check your inbox.</p>
            <hr>
            <a href="{% url 'authenticator:login' %}" class="btn btn-primary">Return to Login</a>
        </div>
    </div>
</div>
{% endblock %}
