{% extends 'base.html' %}
{% block title %}Link Expired{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="alert alert-warning">
            <h4 class="alert-heading">Password Reset Link Expired</h4>
            <p>The password reset link has expired. Please request a new one.</p>
            <hr>
            <a href="{% url 'authenticator:login' %}" class="btn btn-primary">Return to Login</a>
        </div>
    </div>
</div>
{% endblock %}
