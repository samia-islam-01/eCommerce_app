{% extends 'base.html' %}
{% block title %}Invalid Reset Link{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="alert alert-danger">
            <h4 class="alert-heading">Password Reset Error</h4>
            <p>{{ message }}</p>
            <hr>
            <a href="{% url 'authenticator:request_password_reset' %}" class="btn btn-primary">Request New Reset</a>
        </div>
    </div>
</div>
{% endblock %}
