{% extends 'base.html' %}
{% block title %}Edit Store{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title mb-4">Edit Store</h2>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Store Name</label>
                        <input type="text" name="name" value="{{ store.name }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description <span class="text-muted">(optional)</span></label>
                        <textarea name="description" class="form-control" rows="3">{{ store.description }}</textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Store Logo <span class="text-muted">(optional)</span></label>
                        {% if store.logo %}
                            <div class="mb-2">
                                <img src="{{ store.logo.url }}" alt="Current logo" style="max-height:80px;" class="rounded">
                                <small class="d-block text-muted">Upload a new image to replace the current logo.</small>
                            </div>
                        {% endif %}
                        <input type="file" name="logo" accept="image/*" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary">Update</button>
                    <a href="{% url 'store:my_stores' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
