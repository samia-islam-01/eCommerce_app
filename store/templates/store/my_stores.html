{% extends 'base.html' %}
{% block title %}My Stores{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">My Stores</h1>
    <a href="{% url 'store:create_store' %}" class="btn btn-primary">➕ Create Store</a>
</div>

{% if stores %}
    <div class="list-group mb-4">
        {% for store in stores %}
            <div class="list-group-item d-flex justify-content-between align-items-center">
                <strong>{{ store.name }}</strong>
                <div>
                    <a href="{% url 'store:edit_store' store.id %}" class="btn btn-warning btn-sm me-2">Edit</a>
                    <form method="POST" action="{% url 'store:delete_store' store.id %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger btn-sm"
                            onclick="return confirm('Delete this store?')">Delete</button>
                    </form>
                </div>
            </div>
        {% endfor %}
    </div>
{% else %}
    <div class="alert alert-info">You have no stores yet.</div>
{% endif %}

<div class="d-flex gap-2">
    <a href="{% url 'store:create_product' %}" class="btn btn-outline-primary">➕ Create Product</a>
    <a href="{% url 'authenticator:welcome' %}" class="btn btn-outline-dark">🏠 Home</a>
</div>
{% endblock %}
